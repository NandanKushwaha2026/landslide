<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Landslide Monitoring - Register</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="login-container">

    <div class="login-box">

        <h1>🏔️ Landslide Monitoring</h1>

        <p class="login-subtitle">
            Create Your Account
        </p>

        <h2>Register</h2>

        <form id="registerForm">

            <label>Full Name</label>
            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                required
            >

            <label>Mobile Number</label>
            <input
                type="tel"
                id="mobile"
                placeholder="Enter mobile number"
                required
            >

            <label>Email</label>
            <input
                type="email"
                id="email"
                placeholder="Enter email"
                required
            >

            <label>Location</label>
            <input
                type="text"
                id="location"
                placeholder="Enter your location"
                required
            >

            <label>Password</label>
            <input
                type="password"
                id="password"
                placeholder="Create password"
                required
            >

            <button type="submit">
                Register
            </button>

            <p id="registerMessage"></p>

        </form>

        <p>
            Already have an account?
            <a href="login.html">Login</a>
        </p>

    </div>

</div>

<script>
document.getElementById("registerForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const name = document.getElementById("name").value.trim();
    const mobile = document.getElementById("mobile").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const msg = document.getElementById("registerMessage");

    msg.textContent = "Registering...";

    try {
        const res = await fetch("https://landslide-1-0d4j.onrender.com/api/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name: name, phone: mobile, email: email, password: password })
        });
        const data = await res.json();

        if (data.success) {
            msg.textContent = "Registration successful!";
            setTimeout(function() {
                window.location.href = "login.html";
            }, 1500);
        } else {
            msg.textContent = "❌ " + (data.error || "Registration failed");
        }
    } catch (e) {
        msg.textContent = "❌ Server se connect nahi ho pa raha. 1 minute baad try karein.";
        console.error(e);
    }
});

</script>

</body>
</html>
