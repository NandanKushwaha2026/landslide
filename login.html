<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Landslide Monitoring - Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="login-container">

    <div class="login-box">

        <h1>🏔️ Landslide Monitoring</h1>

        <p class="login-subtitle">
            AI-Based Early Warning System
        </p>

        <h2>Login</h2>

        <form id="loginForm">

            <label>Email or Mobile Number</label>

            <input
                type="text"
                id="userInput"
                placeholder="Enter registered email or mobile"
                required
            >

            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                Login
            </button>

            <p id="loginMessage"></p>

        </form>

        <p>
            Don't have an account?
            <a href="register.html">Register</a>
        </p>

    </div>

</div>


<script>

document.getElementById("loginForm").addEventListener("submit", function(event) {

    event.preventDefault();

    let userInput =
        document.getElementById("userInput").value.trim();

    let password =
        document.getElementById("password").value;

    // Registered user data
    let savedUser = localStorage.getItem("user");

    if (!savedUser) {

        document.getElementById("loginMessage").textContent =
            "No account found. Please register first.";

        return;
    }

    let user = JSON.parse(savedUser);

    // Check email/mobile and password
    if (
        (user.email === userInput || user.mobile === userInput) &&
        user.password === password
    ) {

        localStorage.setItem("loggedIn", "true");

        // Save logged-in user's name
        localStorage.setItem("loggedUser", user.name);

        window.location.href = "index.html";

    } else {

        document.getElementById("loginMessage").textContent =
            "❌ Invalid email/mobile or password.";

    }

});

</script>

</body>
</html>
