<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Landslide Monitoring - Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="login-container">

    <div class="login-box">

        <h1>🏔️ Landslide Monitoring</h1>

        <p class="login-subtitle">
            AI-Based Early Warning System
        </p>

        <h2>Login</h2>

        <form id="loginForm">

            <label>Email or Mobile Number</label>

            <input
                type="text"
                id="userInput"
                placeholder="Enter registered email or mobile"
                required
            >

            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                Login
            </button>

            <p id="loginMessage"></p>

        </form>

        <p>
            Don't have an account?
            <a href="register.html">Register</a>
        </p>

    </div>

</div>

<script>
document.getElementById("loginForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const userInput = document.getElementById("userInput").value.trim();
    const password = document.getElementById("password").value;
    const msg = document.getElementById("loginMessage");

    msg.textContent = "Logging in...";

    try {
        const res = await fetch("https://landslide-1-0d4j.onrender.com/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: userInput, password: password })
        });
        const data = await res.json();

        if (data.success) {
            localStorage.setItem("loggedIn", "true");
            localStorage.setItem("loggedUser", data.user.name || data.user.email);
            localStorage.setItem("userEmail", data.user.email);
            window.location.href = "index.html";
        } else {
            msg.textContent = "❌ " + (data.error || "Login failed");
        }
    } catch (e) {
        msg.textContent = "❌ Server se connect nahi ho pa raha. 1 minute baad try karein.";
        console.error(e);
    }
});
</script>

</body>
</html>
