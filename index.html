<!DOCTYPE html>
<html>
<head><link rel="stylesheet" href="style.css">
    <title>Landslide Risk Monitoring System</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>

<body>
    <script>
    if (localStorage.getItem("loggedIn") !== "true") {
        window.location.href = "login.html";
    }
</script>
    <button onclick="logout()" class="logout-btn">
    Logout
</button>

    <h1>AI-Based Landslide Risk Monitoring System</h1>

    <p>North Eastern Region (NER)</p>

    <label for="location">📍 Select Location:</label>

<select id="location">
    <option value="Sikkim">Sikkim</option>
    <option value="Assam">Assam</option>
    <option value="Arunachal Pradesh">Arunachal Pradesh</option>
    <option value="Meghalaya">Meghalaya</option>
    <option value="Nagaland">Nagaland</option>
    <option value="Manipur">Manipur</option>
    <option value="Mizoram">Mizoram</option>
    <option value="Tripura">Tripura</option>
</select>
    <div class="dashboard">

    <div class="card">
        <h2>🌧️ Rainfall</h2>
        <p id="rainfall">Loading...</p>
    </div>

    <div class="card">
        <h2>🌡️ Temperature</h2>
        <p id="temperature">Loading...</p>
    </div>

    <div class="card">
        <h2>💧 Humidity</h2>
        <p id="humidity">Loadinh...</p>
    </div>

    <div class="card">
        <h2>⚠️ Risk Level</h2>
        <p id="riskLevel">Risk Score: --%</p>
    </div>

</div>

    <button onclick="checkRisk()">Check Landslide Risk</button>
    <!-- SMS Alert History -->
<div class="sms-history">
    <h2>📱 SMS Alert History</h2>

    <div id="smsHistory">
        <p>No SMS alerts yet.</p>
    </div>
</div>

    <div id="riskResult" class="risk-result"></div>
    <h2 class="map-title">🗺️ Landslide Risk Map</h2>

    <h2 class="map-title">🗺️ Landslide Risk Map</h2>

    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
    <script>

function logout() {

    localStorage.removeItem("loggedIn");
    localStorage.removeItem("loggedUser");

    window.location.href = "login.html";

}

</script>
</body>
</html>
